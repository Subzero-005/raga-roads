version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: raga-roads-db
    environment:
      POSTGRES_DB: ragaroadsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - raga_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: raga-roads-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: jdbc
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ragaroadsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: raga-roads-jwt-secret-key-must-be-at-least-32chars
      APP_JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  raga_db_data:
