server.port=8080
spring.application.name=raga-roads

# Active profile: "inmemory" (default) or "jdbc" (requires PostgreSQL)
spring.profiles.active=inmemory

# JWT Configuration (secret must be >= 32 characters for HS256)
app.jwt.secret=raga-roads-jwt-secret-key-must-be-at-least-32chars
app.jwt.expiration=86400000

# Logging
logging.level.com.ragaroads=DEBUG
logging.file.name=logs/raga-roads.log
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
